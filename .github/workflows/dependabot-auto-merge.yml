name: Dependabot auto-merge

# Auto-merge Dependabot PRs once the required checks (build + dependency-review)
# pass. Scope: patch + minor version updates. This covers nearly all security
# updates too — Dependabot bumps to the minimum fixed version, which is almost
# always within the same major. MAJOR bumps are deliberately held for manual
# review: a green test suite does not prove a major dependency left the shipped
# behavior unchanged.
#
# This uses `on: pull_request` with explicit write permissions — the pattern
# GitHub documents for Dependabot auto-merge. The Dependabot-triggered run
# receives a token scoped to the permissions declared below. We never check out
# or execute the PR's code here, so `pull_request_target` is not needed.

on:
  pull_request:
    branches: [main]

# Cancel superseded runs when Dependabot rebases/force-pushes a PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only act on PRs opened by Dependabot.
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag major bumps for manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "🔍 **Held for manual review.** This is a major version bump of \
          \`${{ steps.meta.outputs.dependency-names }}\` \
          (\`${{ steps.meta.outputs.previous-version }}\` → \`${{ steps.meta.outputs.new-version }}\`). \
          Auto-merge is restricted to patch/minor updates — a passing test suite \
          does not prove a major bump left shipped behavior unchanged. Review the \
          changelog and merge manually if it looks good."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
